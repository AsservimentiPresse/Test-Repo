<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>ASSIEME - AR Viewer</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>

body{
margin:0;
background:#000;
display:flex;
flex-direction:column;
align-items:center;
color:white;
font-family:sans-serif;
}

model-viewer{
width:95vw;
height:75vh;
}

/* AR button */

model-viewer::part(default-ar-button){
width:110px;
height:110px;
border-radius:50%;
background:white;
}

/* BOTTONI */

.animButton{
width:90px;
height:90px;
border:none;
border-radius:14px;
overflow:hidden;
cursor:pointer;
background:#333;
display:flex;
align-items:center;
justify-content:center;
}

.animButton img{
width:100%;
height:100%;
object-fit:cover;
}

.animButton.active{
outline:4px solid white;
}

.reset{
padding:14px 24px;
border-radius:12px;
border:none;
background:#444;
color:white;
font-size:1.1rem;
cursor:pointer;
}

/* COLORI */

button.color{
padding:12px 22px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:1rem;
color:white;
}

.green{background:green;}
.blue{background:blue;}
.yellow{background:yellow;color:black;}
.lightgray{background:lightgray;color:black;}
.darkgray{background:dimgray;}
.red{background:red;}
.orange{background:orange;}

</style>

</head>

<body>

<model-viewer
id="viewer"
src="linea lunga PROVA ANIMAZIONI.glb"
ar
ar-modes="webxr scene-viewer quick-look"
camera-controls
auto-rotate
shadow-intensity="0"
exposure="0.5">

<!-- 🔥 ANIMATION BUTTONS XR (DISTANTI) -->

<button slot="hotspot-anim0" class="animButton"
data-position="-1 1.6 -0.8" data-normal="0 0 1"
onclick="toggleAnimation(0)" id="xr-anim0"> <img src="anim1.png"> </button>

<button slot="hotspot-anim1" class="animButton"
data-position="0 1.6 -0.8" data-normal="0 0 1"
onclick="toggleAnimation(1)" id="xr-anim1"> <img src="anim2.png"> </button>

<button slot="hotspot-anim2" class="animButton"
data-position="1 1.6 -0.8" data-normal="0 0 1"
onclick="toggleAnimation(2)" id="xr-anim2"> <img src="anim3.png"> </button>

<button slot="hotspot-anim3" class="animButton"
data-position="-0.5 1.2 -0.8" data-normal="0 0 1"
onclick="toggleAnimation(3)" id="xr-anim3"> <img src="anim4.png"> </button>

<button slot="hotspot-anim4" class="animButton"
data-position="0.5 1.2 -0.8" data-normal="0 0 1"
onclick="toggleAnimation(4)" id="xr-anim4"> <img src="anim5.png"> </button>

<!-- RESET -->

<button slot="hotspot-reset" class="reset"
data-position="0 0.9 -0.8" data-normal="0 0 1"
onclick="resetAnimations()">
RESET </button>

<!-- COLORI STRUCTURE -->

<button slot="hotspot-color-s1" class="color green"
data-position="-1 0.6 -0.8" data-normal="0 0 1"
onclick="changeColor(0,[0,0.1,0,1])">Verde</button>

<button slot="hotspot-color-s2" class="color blue"
data-position="-0.5 0.6 -0.8" data-normal="0 0 1"
onclick="changeColor(0,[0,0,0.18,1])">Blu</button>

<button slot="hotspot-color-s3" class="color orange"
data-position="0 0.6 -0.8" data-normal="0 0 1"
onclick="changeColor(0,[1,0.12,0,1])">Arancio</button>

<button slot="hotspot-color-s4" class="color lightgray"
data-position="0.5 0.6 -0.8" data-normal="0 0 1"
onclick="changeColor(0,[0.55,0.55,0.55,1])">Grigio</button>

<button slot="hotspot-color-s5" class="color darkgray"
data-position="1 0.6 -0.8" data-normal="0 0 1"
onclick="changeColor(0,[0.25,0.25,0.25,1])">Scuro</button>

<!-- MOBILE PARTS -->

<button slot="hotspot-color-m1" class="color green"
data-position="-1 0.3 -0.8" data-normal="0 0 1"
onclick="changeColor(2,[0,0.1,0,1])">Verde</button>

<button slot="hotspot-color-m2" class="color blue"
data-position="-0.5 0.3 -0.8" data-normal="0 0 1"
onclick="changeColor(2,[0,0,1,1])">Blu</button>

<button slot="hotspot-color-m3" class="color yellow"
data-position="0 0.3 -0.8" data-normal="0 0 1"
onclick="changeColor(2,[1,1,0,1])">Giallo</button>

<button slot="hotspot-color-m4" class="color lightgray"
data-position="0.5 0.3 -0.8" data-normal="0 0 1"
onclick="changeColor(2,[0.55,0.55,0.55,1])">Grigio</button>

<button slot="hotspot-color-m5" class="color darkgray"
data-position="1 0.3 -0.8" data-normal="0 0 1"
onclick="changeColor(2,[0.33,0.33,0.33,1])">Scuro</button>

</model-viewer>

<script>

const modelViewer=document.querySelector("#viewer")

let animations=[]
let currentAnimation=null

modelViewer.addEventListener("load",()=>{
animations=modelViewer.availableAnimations
})
